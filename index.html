<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الهروب من المدينة | City Escape</title>
<style>
  *{box-sizing:border-box} html,body{margin:0;height:100%;overflow:hidden;background:#111827;font-family:Tahoma,Arial,sans-serif}
  #game{display:block;width:100%;height:100%}
  #hud{position:fixed;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;gap:10px;pointer-events:none;color:#fff}
  .pill{background:#111827d9;border:1px solid #ffffff30;border-radius:14px;padding:10px 14px;box-shadow:0 5px 20px #0003;font-weight:bold}
  #help{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);color:white;background:#111827dc;border:1px solid #ffffff30;border-radius:14px;padding:10px 14px;text-align:center;font-size:14px;white-space:nowrap;max-width:95vw}
  #overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#07111dcc;color:white;padding:20px}
  .panel{width:min(440px,100%);background:linear-gradient(145deg,#1e293b,#0f172a);border:1px solid #ffffff30;border-radius:24px;padding:28px;text-align:center;box-shadow:0 20px 70px #0008}
  h1{margin:0 0 10px;font-size:clamp(28px,5vw,42px)} p{line-height:1.8;color:#dbeafe}
  button{border:0;border-radius:14px;background:#fbbf24;color:#111827;padding:13px 24px;font-size:18px;font-weight:bold;cursor:pointer}
  button:hover{background:#fcd34d} .small{font-size:13px;color:#94a3b8}
  @media(max-width:600px){#hud{top:8px;left:8px;right:8px}.pill{padding:8px 10px;font-size:13px}#help{font-size:12px;white-space:normal}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="pill">🪙 النقود: <span id="coins">0</span></div>
  <div class="pill">🏃 المسافة: <span id="distance">0</span> م</div>
  <div class="pill">⚡ السرعة: <span id="speed">1</span></div>
</div>
<div id="help">التحكم: ← → أو A / D للتغيير بين المسارات • ↑ أو Space للقفز</div>
<div id="overlay">
  <div class="panel">
    <h1 id="title">الهروب من المدينة</h1>
    <p id="message">اركض، اجمع النقود، وتجنب الحواجز والسيارات قبل أن تمسك بك الشرطة!</p>
    <button id="start">ابدأ اللعب</button>
    <p class="small">لعبة ثلاثية الأبعاد مبسطة تعمل مباشرة في المتصفح.</p>
  </div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const canvas = document.querySelector('#game');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 32, 150);
const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.1, 220);
camera.position.set(0, 6.5, 11);
camera.lookAt(0, 1, -8);

scene.add(new THREE.HemisphereLight(0xe8f6ff, 0x596273, 2.0));
const sun = new THREE.DirectionalLight(0xfff0cf, 2.7);
sun.position.set(-7, 15, 8); sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024); scene.add(sun);

const mat=(color,roughness=0.8)=>new THREE.MeshStandardMaterial({color,roughness});
const roadMat=mat(0x343b46), lineMat=mat(0xf8fafc), grassMat=mat(0x4f9b55);
const buildingMats=[0xc4b5a5,0x9ca3af,0xe0c097,0x8ca3b8,0xd4d4d8].map(c=>mat(c));
const obstacleMat=mat(0xf97316), coinMat=new THREE.MeshStandardMaterial({color:0xffc928,metalness:0.7,roughness:0.25});
const darkMat=mat(0x202938), skinMat=mat(0xf0bd91), shirtMat=mat(0x2563eb), pantsMat=mat(0x172554);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(300,300), grassMat);
ground.rotation.x=-Math.PI/2; ground.position.y=-0.12; ground.receiveShadow=true; scene.add(ground);

// Road and lane markings
const road=new THREE.Mesh(new THREE.PlaneGeometry(10,260),roadMat);
road.rotation.x=-Math.PI/2; road.position.set(0,0,-95); road.receiveShadow=true; scene.add(road);
const laneDashes=[], cityPieces=[];
for(const x of [-1.67,1.67]){
  for(let z=-220;z<20;z+=8){
    const dash=new THREE.Mesh(new THREE.BoxGeometry(0.09,0.025,3.8),lineMat);
    dash.position.set(x,0.025,z); dash.userData.baseZ=z; scene.add(dash); laneDashes.push(dash);
  }
}
function box(w,h,d,material,x,y,z,parent=scene){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
  m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; parent.add(m); return m;
}
function makeBuilding(x,z){
  const h=4+Math.random()*13, w=3+Math.random()*3, d=4+Math.random()*5;
  const b=box(w,h,d,buildingMats[Math.floor(Math.random()*buildingMats.length)],x,h/2-0.1,z);
  // small glowing-looking windows on street-facing wall
  const winMat=new THREE.MeshStandardMaterial({color:Math.random()>.5?0xfff0b3:0x8bd5ff,emissive:0x223344,roughness:.4});
  const side=x<0?1:-1;
  for(let yy=1.2;yy<h-0.5;yy+=1.7){
    for(let xx=-w/2+0.5;xx<w/2-0.3;xx+=1.1){
      const win=new THREE.Mesh(new THREE.BoxGeometry(.38,.55,.045),winMat);
      win.position.set(x+xx,yy,z+side*(d/2+.025)); scene.add(win);
      cityPieces.push(win);
    }
  }
  cityPieces.push(b);
}
for(let z=-220;z<20;z+=15){makeBuilding(-8-Math.random()*2,z);makeBuilding(8+Math.random()*2,z-5)}
// Sidewalk curbs
for(const x of [-5.25,5.25]) box(.45,.18,260,mat(0xcbd5e1),x,.02,-95);

const player=new THREE.Group(); scene.add(player);
box(.72,.85,.45,shirtMat,0,1.25,0,player);
const head=new THREE.Mesh(new THREE.SphereGeometry(.28,16,12),skinMat); head.position.set(0,1.9,0); head.castShadow=true; player.add(head);
box(.18,.5,.2,pantsMat,-.2,.58,0,player); box(.18,.5,.2,pantsMat,.2,.58,0,player);
box(.17,.52,.18,skinMat,-.5,1.25,0,player); box(.17,.52,.18,skinMat,.5,1.25,0,player);
player.position.set(0,0,3);

function makePoliceCar(){
 const g=new THREE.Group();
 box(1.45,.55,2.5,mat(0xf8fafc),0,.58,0,g);
 box(1.15,.5,1.2,mat(0x1d4ed8),0,1.05,-.15,g);
 box(1.5,.12,.25,mat(0xef4444),0,1.35,-.15,g);
 for(const x of [-.78,.78]) for(const z of [-.75,.75]){
  const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,.14,12),darkMat);
  wheel.rotation.z=Math.PI/2; wheel.position.set(x,.35,z); g.add(wheel);
 }
 ; scene.add(g); return g;
}
const police=makePoliceCar();

const obstacles=[], coins=[];
function makeObstacle(lane,z){
 const g=new THREE.Group();
 if(Math.random()<.5){
   box(1.1,.85,.65,obstacleMat,0,.43,0,g);
   box(1.15,.15,.72,mat(0xfde68a),0,.45,0,g);
 }else{
   box(1.35,.7,.45,mat(0xef4444),0,.36,0,g);
   box(1.4,.13,.5,mat(0xfef3c7),0,.38,0,g);
 }
 g.position.set(lane*2.5,0,z); scene.add(g); obstacles.push({mesh:g,passed:false});
}
function makeCoin(lane,z,y=1.3){
 const c=new THREE.Mesh(new THREE.TorusGeometry(.32,.105,10,18),coinMat);
 c.position.set(lane*2.5,y,z); c.rotation.y=Math.PI/2; c.castShadow=true; scene.add(c); coins.push(c);
}
for(let z=-22;z>-210;z-=8){
 if(Math.random()<.72) makeObstacle(Math.floor(Math.random()*3)-1,z);
 if(Math.random()<.8) makeCoin(Math.floor(Math.random()*3)-1,z-3,1.25+Math.random()*.5);
}
let lane=0, jumping=false, jumpV=0, score=0, distance=0, speed=19, running=false, ended=false, last=0;
const laneX=[-2.5,0,2.5];

function resetGame(){
 for(const o of obstacles) scene.remove(o.mesh); obstacles.length=0;
 for(const c of coins) scene.remove(c); coins.length=0;
 lane=0; player.position.set(0,0,3); jumping=false; jumpV=0; score=0; distance=0; speed=19; ended=false;
 police.position.z=-20; police.position.x=0;
 for(let z=-22;z>-210;z-=8){if(Math.random()<.72)makeObstacle(Math.floor(Math.random()*3)-1,z);if(Math.random()<.8)makeCoin(Math.floor(Math.random()*3)-1,z-3,1.25+Math.random()*.5)}
 updateHUD();
}
function updateHUD(){
 document.querySelector('#coins').textContent=score;
 document.querySelector('#distance').textContent=Math.floor(distance);
 document.querySelector('#speed').textContent=(speed/19).toFixed(1)+'x';
}
function startGame(){
 resetGame(); running=true; document.querySelector('#overlay').style.display='none'; last=performance.now(); renderer.setAnimationLoop(animate);
}
function endGame(){
 running=false; ended=true; renderer.setAnimationLoop(null);
 document.querySelector('#title').textContent='أمسكت بك الشرطة!';
 document.querySelector('#message').innerHTML=`جمعت <b>${score}</b> قطعة نقدية وقطعت <b>${Math.floor(distance)}</b> مترًا. حاول مرة أخرى لتحقق نتيجة أفضل!`;
 document.querySelector('#start').textContent='العب مرة أخرى';
 document.querySelector('#overlay').style.display='flex';
}
document.querySelector('#start').addEventListener('click',startGame);
function changeLane(dir){lane=Math.max(-1,Math.min(1,lane+dir))}
function jump(){if(!jumping){jumping=true;jumpV=8.5}}
addEventListener('keydown',e=>{
 if(['ArrowLeft','ArrowRight','ArrowUp',' '].includes(e.key))e.preventDefault();
 if(!running){if(e.key==='Enter')startGame();return}
 if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')changeLane(-1);
 if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')changeLane(1);
 if(e.key==='ArrowUp'||e.key===' ')jump();
});
let touchX=null,touchY=null;
addEventListener('touchstart',e=>{touchX=e.changedTouches[0].clientX;touchY=e.changedTouches[0].clientY},{passive:true});
addEventListener('touchend',e=>{
 if(!running||touchX===null)return;
 const dx=e.changedTouches[0].clientX-touchX, dy=e.changedTouches[0].clientY-touchY;
 if(Math.abs(dx)>Math.abs(dy)){changeLane(dx>0?-1:1)}else if(dy< -20)jump();
 touchX=touchY=null;
},{passive:true});

function animate(now){
 if(!running)return;
 const dt=Math.min((now-last)/1000,.04);last=now;
 distance+=speed*dt*.35; speed=Math.min(32,19+distance*.025);
 player.position.x+=(laneX[lane+1]-player.position.x)*Math.min(1,dt*12);
 if(jumping){player.position.y+=jumpV*dt;jumpV-=21*dt;if(player.position.y<=0){player.position.y=0;jumping=false;jumpV=0}}
 // Simple running bounce
 player.rotation.z=Math.sin(now*.012)*.025;
 police.position.z+=speed*.11*dt;
 if(police.position.z>player.position.z-4) {endGame();return}
 for(const o of obstacles){
   o.mesh.position.z+=speed*dt;
   if(!o.passed&&o.mesh.position.z>player.position.z-0.3){
     o.passed=true;
     const sameLane=Math.abs(o.mesh.position.x-player.position.x)<1.15;
     if(sameLane && player.position.y<.65){endGame();return}
   }
   if(o.mesh.position.z>12){scene.remove(o.mesh)}
 }
 // Refill obstacle stream ahead
 while(obstacles.length && obstacles[0].mesh.position.z>12) obstacles.shift();
 const farZ=obstacles.length?Math.min(...obstacles.map(o=>o.mesh.position.z)):-30;
 if(farZ>-185){makeObstacle(Math.floor(Math.random()*3)-1,-205)}
 for(let i=coins.length-1;i>=0;i--){
   const c=coins[i];c.position.z+=speed*dt;c.rotation.z+=dt*3;
   if(Math.abs(c.position.z-player.position.z)<1 && Math.abs(c.position.x-player.position.x)<1 && Math.abs(c.position.y-(player.position.y+1.2))<1){
     score++;scene.remove(c);coins.splice(i,1);continue;
   }
   if(c.position.z>12){scene.remove(c);coins.splice(i,1)}
 }
 if(coins.length<15){makeCoin(Math.floor(Math.random()*3)-1,-210-Math.random()*20,1.2+Math.random()*.5)}
 for(const d of laneDashes){d.position.z+=speed*dt;if(d.position.z>12)d.position.z=-220}
 // city buildings drift toward player and wrap around
 for(const p of cityPieces){p.position.z+=speed*dt;if(p.position.z>16)p.position.z-=240}
 police.position.x+=(player.position.x-police.position.x)*dt*.5;
 camera.position.x+=(player.position.x*.28-camera.position.x)*dt*2;
 camera.lookAt(player.position.x*.18,1.3,-8);
 updateHUD();
 renderer.render(scene,camera);
}
renderer.setAnimationLoop(()=>{if(!running){renderer.render(scene,camera);return}animate(performance.now())});
addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);
});
renderer.render(scene,camera);
</script>
</body>
</html>
